stages:
  - style
  - linter
  - unit tests
  - build
  - deploy

.pipeline-rules:
  r1: &push_dev $CI_PIPELINE_SOURCE == 'push' && $CI_COMMIT_BRANCH == 'develop'
  r2: &job_build $JOB == 'build'
  r3: &merge_request $CI_PIPELINE_SOURCE == 'merge_request_event'
  r4: &job_deploy $JOB == 'deploy'
  r5: &new_tag $CI_COMMIT_TAG

variables:
  GITLAB_EJ_TOKEN: "gitlab+deploy-token-533883:51xTbvyHGmEfeZZUxUct"
  EJ_THEME: "ej"
  SERVICE: "ej"
  ENVIRONMENT:
    value: "prod"
    description: "Ambiente no qual o JOB será executado."
    options:
      - "homol"
      - "prod"
  JOB:
    value: "none"
    description: "JOB desejado."
    options:
      - "build"
      - "none"
      - "deploy"
  VERSION:
    value: "$CI_COMMIT_SHORT_SHA"
    description: "Versão a ser deployada, alterar."

# Templates
.kaniko-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    - test -n "$CONTEXT" || { echo "CONTEXT não definido"; exit 1; }
    - test -n "$EJ_THEME" || { echo "EJ_THEME não definido"; exit 1; }
    - test -n "$DOCKERFILE" || { echo "DOCKERFILE não definido"; exit 1; }
    - test -f "$DOCKERFILE" || { echo "Dockerfile não encontrado - $DOCKERFILE"; exit 1; }
    - export IMAGE_NAME="$CI_REGISTRY_IMAGE/$SERVICE:$IMAGE_TAG"
    - export CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE"
    - export CI_REGISTRY_USER="$CI_REGISTRY_USER"
    - export CI_REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - echo "Autenticando"
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "auth": "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)"
          }
        }
      }
      EOF
    - echo "Building and pushing $IMAGE_NAME"
    - |
      /kaniko/executor \
        --context "$CONTEXT" \
        --dockerfile "$DOCKERFILE" \
        --destination "$IMAGE_NAME" \
        --build-arg VERSION="$IMAGE_TAG" --build-arg EJ_THEME="$EJ_THEME" \
        --log-timestamp

.deploy-registry:
  stage: deploy
  script:
    - if [ -z $PROJECT_PATH ]; then echo "Variável com valor inválido >>PROJECT_PATH. Erro! Finalizando a pipeline..."; exit 1; fi
    - if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ] ; then echo "Variável com valor inválido >>VERSION. Exiting! (VERSION=$VERSION)"; exit 1; fi
    - echo "Fazendo o deploy da versão $VERSION."
    - hostname -s
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" | base64 | tr -d "\n")\"}}}" > ~/.docker/config.json
    - sed -E -i "s|(image:.*):([^\"']+)([\"']?)|\1:$VERSION\3|g" "$PROJECT_PATH/$IMAGES_FILE"
    - docker compose --file $COMPOSE_FILE $ENV_OPT pull --ignore-pull-failures
    - docker logout
    - docker compose --file $COMPOSE_FILE up --build -d server celery
    - rm ~/.docker/config.json -f
  variables:
    GIT_STRATEGY: none
    COMPOSE_FILE: $PROJECT_PATH/docker-compose.yaml
    IMAGES_FILE: ej.yaml

.deploy-local:
  stage: deploy
  script:
    - if [ -z $PROJECT_PATH ]; then echo "Variável com valor inválido >>PROJECT_PATH. Erro! Finalizando a pipeline..."; exit 1; fi
    - echo "Iniciando deploy em $PROJECT_PATH"
    - hostname -s
    - cd $PROJECT_PATH
    - git config --global --add safe.directory "$PROJECT_PATH"
    - git fetch --all
    - git checkout -f $CI_COMMIT_BRANCH
    - git reset --hard origin/$CI_COMMIT_BRANCH
    - docker compose --file $COMPOSE_FILE up --build -d server celery
  variables:
    GIT_STRATEGY: none
    COMPOSE_FILE: $PROJECT_PATH/docker/docker-compose.yml

# Jobs
docker-build:
  extends: .kaniko-build
  variables:
    CONTEXT: .
    DOCKERFILE: docker/Dockerfile-prod
    IMAGE_TAG: $CI_COMMIT_TAG
    FF_TIMESTAMPS: "1"
  rules:
    - if: *job_build
    - if: *new_tag

deploy-registry:
  extends: .deploy-registry
  environment:
    name: "$ENVIRONMENT"
    action: start
  variables:
    PROJECT_PATH: /home/pencillabs/ej/${ENVIRONMENT}
  tags:
    - ej-shell-runner
  rules:
    - if: *job_deploy
      needs: []

deploy-local:
  extends: .deploy-local
  variables:
    PROJECT_PATH: /home/pencillabs/ej-application
  tags:
    - ej-shell-runner
  rules:
    - if: *push_dev

black:
  stage: style
  image:
    name: python:3.12-slim-bookworm
  before_script:
    - pip install --no-cache-dir poetry
  script:
    - poetry install --only dev --no-root
    - poetry run black --check .
  rules:
    - if: *merge_request

ruff:
  stage: linter
  image:
    name: python:3.12-slim-bookworm
  before_script:
    - pip install ruff==0.3.7
  script:
    - ruff check
  rules:
    - if: *merge_request

pytest:
  stage: unit tests
  image:
    name: python:3.12-slim-bookworm
  services:
    - name: postgres:15
      alias: db
    - name: rabbitmq:3-management
      alias: rabbitmq
  variables:
    POETRY_VIRTUALENVS_CREATE: "true"
    POSTGRES_DB: ej
    POSTGRES_USER: ej
    POSTGRES_PASSWORD: ej
    RABBITMQ_DEFAULT_USER: guest
    RABBITMQ_DEFAULT_PASS: guest
  before_script:
    - apt-get update && apt-get install libpq-dev gcc g++ libjpeg-dev zlib1g-dev git -y
    - pip install --no-cache-dir poetry
  script:
    - poetry install --with main,dev --no-root
    - poetry run inv docs
    - poetry run inv test
  cache:
    key:
      files:
        - ej-application/poetry.lock
    paths:
      - ej-application/.venv
  rules:
    - if: *merge_request

name: homol-ej-community

x-common-config:
  &common
  env_file:
    - .env
  restart: unless-stopped

services:
    db:
        <<: *common    
        image: postgres:16
        volumes:
            - "ej_db_data:/var/lib/postgresql/data"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ej -d ej"]
            interval: 30s
            timeout: 10s
            retries: 3
    
    server:
        <<: *common
        build:
            context: ../
            dockerfile: docker/Dockerfile
        volumes:
            - ../:/ej-application/
            - "statics:/ej-application/local/"
        ports:
          - "${SERVER_PORT:-8000}:8000"
        entrypoint: ["/bin/bash", "docker/run_local_server.sh"]
        depends_on:
            - rabbitmq
            - celery
            - db
        healthcheck:
            test: curl -sI --fail http://localhost:8000/api/health

    celery:
        <<: *common
        build:
            context: ../
            dockerfile: docker/Dockerfile
        volumes:
            - ../:/ej-application/
        entrypoint: ["/bin/bash", "-c", "poetry run inv celery"]
        depends_on:
            - rabbitmq
            - db

    rabbitmq:
        <<: *common
        image: rabbitmq:4
        hostname: rabbitmq-server
        volumes:
            - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3

volumes:
    ej_db_data:
    statics:

x-common-config:
  &env-common
  env_file:
    - ../.env
  restart: unless-stopped

services:
    db:
        <<: *env-common
        image: postgres:16
        volumes:
            - "ej_db_data:/var/lib/postgresql/data"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ej -d ej"]
            interval: 30s
            timeout: 10s
            retries: 3

    server:
        # The inv build command will create the ej-server image
        image: ej-server
        build:
            context: ../
            dockerfile: docker/Dockerfile
        volumes:
            - ../:/ej-application/
            - "statics:/ej-application/local/"
        ports:
          - "${SERVER_PORT:-8000}:8000"
        entrypoint: ["/bin/bash", "docker/run_local_server.sh"]
        depends_on:
            - rabbitmq
            - db
        <<: *env-common
        environment:
            # Translations and internacionalization
            - LC_ALL=pt_BR.UTF-8
            - LANG=pt_BR.UTF-8
            - LANGUAGE=pt_BR.UTF-8

    celery:
        image: ej-server
        volumes:
            - ../:/ej-application/
        entrypoint: ["/bin/bash", "-c", "poetry run inv celery"]
        depends_on:
            - rabbitmq
            - db
            - server
        <<: *env-common

    rabbitmq:
        image: rabbitmq:4
        hostname: rabbitmq-server
        volumes:
            - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3
        <<: *env-common

volumes:
    ej_db_data:
    statics:
